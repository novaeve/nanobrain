name: nanoBrain checks

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra dev
      - run: uv run --no-sync pytest tests/test_nanobrain_contract.py tests/test_nanobrain_paths.py tests/test_nanobrain_training.py tests/test_nanobrain_independent_tasks.py tests/test_nanobrain_development_pairs.py tests/test_build_leaderboard.py tests/test_dataset_release.py tests/test_custom_encoder.py -q
      - run: uv run --no-sync ruff check src/nanobrain/environment.py src/nanobrain/dataset_release.py scripts/build_leaderboard.py tests/test_build_leaderboard.py tests/test_dataset_release.py
      - run: uv run --no-sync python scripts/build_leaderboard.py
      - run: git diff --exit-code benchmarks/nanobrain_v3_100k
