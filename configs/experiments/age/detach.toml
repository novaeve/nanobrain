description = "Probe: the logistic head on a detached latent (the encoder never sees the age loss). If logistic is no better on held-out age than this probe, the task adds nothing to the latent; any change of the other tasks in logistic is the age gradient's. Age task (registered 2026-11-13, before any run, after the design review). Labels: days post fertilization (data_build/build_age.py). 15% of datasets (age-stratified, seed 0) have their age labels masked in training, so the head cannot read dataset -> mean age. Evaluation: scripts/eval_age.py on eval_10k cells of the held-out datasets, against dataset_mean (falls back to the global age distribution there) and ridge on expression with a split-conformal interval (scripts/fit_age_baseline.py). Rule: useful if (i) held-out 90% coverage within 0.85-0.95 (no recalibration), (ii) held-out interval score in log days and median log error better than both baselines overall and per band no worse than ridge by more than 10%, and (iii) every other task inside the B0 spread (integration batch especially: age must not be bought with batch information)"
status = "dropped"
outcome = "Fails at 10k: held-out datasets (9, 1545 closed-label eval cells): ridge IS 7.69, dataset_mean IS 6.54; the detached probe covers 0.915 only with uninformative intervals (median relative width 146) and IS 9.77. It also moved the other tasks (region 0.592, cell type 0.723, batch 0.345) although no gradient reaches the encoder: train clips the gradient norm over all parameters, so the probe's large gradients shrink every update. A clean probe needs its own clipping"
extends = ["_base.toml"]
run = { name = "age_detach", out = "runs/age/detach" }

[model]
age_detach = true
