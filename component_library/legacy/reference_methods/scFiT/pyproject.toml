[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scfit"
version = "0.1.0"
description = "Research prototype for time-conditioned single-cell trajectory modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scanpy>=1.10",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
  "umap-learn>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
