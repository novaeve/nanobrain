data:
  source: data/raw/benchmarks/zebrafish_embryonic/new_processed/remove_recovery-count_data-hvg.csv
  preprocessed_dir: data/processed/benchmarks/zebrafish_remove_recovery_hvg2000
  time_col: author_day

protocol:
  path: configs/protocols/benchmark/zebrafish_remove_recovery.yaml

experiment:
  output_dir: results/experiments/benchmark
  run_name: zebrafish_remove_recovery_scfgpt_v1

model:
  top_k_genes: 2000
  d_model: 512
  nhead: 8
  d_ff: 2048
  nlayers: 8
  dropout: 0.1
  value_encoder:
    max_value: 32.0
  adaln:
    share_projection: false

training:
  batch_size: 24
  lr: 0.0002
  weight_decay: 0.0001
  epochs: 10
  iters_per_epoch: 500
  seed: 42
  log_every_steps: 20
  val_every_steps: 500
  save_every_epochs: 1
  amp: true
  grad_clip: 1.0
  resume:
  gpu_reservation:
    enabled: false
    reserve_gb:
    fraction_of_free: 0.3
  loss_weights:
    cfm: 1.0
    wasserstein_hvg: 0.5
    wasserstein_pca50: 0.1
    mean: 0.1
    variance: 0.0
  variance_loss_use_log: true
  variance_loss_eps: 0.0001

validation:
  max_cells_per_time: 256

inference:
  n_steps: 10
  micro_batch_size: 8

ot:
  epsilon: 0.05
  max_iter: 100

evaluation:
  assets_dir: results/eval_assets/benchmark/zebrafish_remove_recovery
  batch_size: 24
  max_cells_per_time: 0
