# Human PBMC 10k multiome scATAC full-run configuration
# Full ATAC peak set: 111,743 peaks -> grid_size 335 (335^2 = 112,225)

model:
  n_genes: 111743
  grid_size: 335
  d_model: 512
  dual_head: true
  d_state_row: 64
  d_state_col: 16
  n_layers: 8
  activation_checkpointing: true

training:
  experiment_dir: results/task3_atac
  n_gpus: 1
  gpu_ids: "5"
  master_port: 29514
  batch_size_per_gpu: 6
  spectral_coords: "data/task3_atac/pbmc_human_10k/10k_PBMC_Multiome_nextgem_Chromium_X_atac_grid335_coords.npy"
  expression_transform: tfidf_log1p_1e4
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.01
  val_ratio: 0.1
  seed: 42
  epochs: 10
  lr: 0.0005
  min_lr: 0.000001
  val_every_epochs: 1
  save_every_epochs: 10

  loss_weights:
    weighted_x1: 1.0
    pearson: 0.1
    cell_pearson: 0.1
    pearson_nonzero: 0.0
    binary: 1.0
    binary_rank: 0.0

inference:
  n_steps: 10
  temperature: 0.1
  hard_gate: true
  open_threshold: 0.5

validation:
  n_steps: 10
  temperature: 0.1
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.1
  mask_seed: 1234
  noise_seed: 5678
  max_batches: 8
  batch_size: 1
  auprc_guard_multiplier: 2.0
