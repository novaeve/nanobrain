# scUniFlow configuration for PBMC68k raw-count h5ad
# Dataset path is still passed from CLI via --data.
model:
  n_genes: 32738
  grid_size: 181         # 181^2 = 32761 >= 32738, only 23 padded slots
  d_model: 512
  d_state_row: 64
  d_state_col: 16
  n_layers: 8

training:
  experiment_dir: results/pretrain
  n_gpus: 1
  gpu_ids: "0"
  master_port: 29501
  batch_size_per_gpu: 25
  spectral_coords: data/gene_coords/pbmc68k_raw_counts_augmented_gene_coords.npy
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.0
  val_ratio: 0.1
  seed: 42
  epochs: 8
  lr: 0.0005
  min_lr: 0.000001
  log_every_steps: 50
  val_every_steps: 200
  save_every_epochs: 1

  loss_weights:
    weighted_x1: 1.0
    pearson: 0.1
    cell_pearson: 0.1

inference:
  n_steps: 10
  temperature: 0.1

validation:
  n_steps: 10
  temperature: 0.1
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.0
  mask_seed: 1234
  noise_seed: 5678
  max_batches: 10
  batch_size: 25
