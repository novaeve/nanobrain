[project]
name = "brainwm-unified"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.9", "numpy", "scipy"]

# One environment for everything (uv pip install -e ".[eval,scvi,dev]"); versions float. Keep torch at the
# version FlashAttention-3 was built against (2.9.1: uv pip install -c "torch==2.9.1" ...); with it, cuML
# resolves to a release that needs numpy < 2.3.
[project.optional-dependencies]
eval = ["scikit-learn", "xgboost", "cuml-cu12", "scib-metrics", "jax[cuda12]", "anndata", "pandas", "scanpy", "harmonypy"]
scvi = ["scvi-tools"]
dev = ["ruff", "pytest"]

[project.scripts]
cajal = "brainwm_unified.cli:main"
nanobrain = "nanobrain.cli:main"

[tool.setuptools.packages.find]
include = ["brainwm_unified*", "nanobrain*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
