[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nanobrain"
version = "0.1.0"
description = "A compact, reproducible virtual-cell research and teaching benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<2.3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "POT>=0.9.5",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
cpu = ["torch>=2.10,<2.11"]
dev = ["pytest>=8.3", "ruff>=0.11"]
benchmark = [
  "anndata>=0.11",
  "scanpy>=1.11",
  "scib-metrics>=0.5",
]

[project.scripts]
nanobrain-data = "nanobrain.dataset_release:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobrain", "src/brainwm", "src/brainwm_data", "src/brainwm_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
]
