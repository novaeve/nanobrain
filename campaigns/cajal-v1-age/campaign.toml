# DRAFT (defined, not frozen, not run): Cajal v1 with age as a sixth joint objective.
# Input: a cell's expression. Output: an interval of age in days post fertilization (always positive).
# Edit freely until `nanobrain --freeze`; once frozen, any change is a new campaign.
# Before it can run: (1) the age reference (configs/experiments/age/logistic.toml at 10k) must be trained and
# scored once by this protocol, since no saved Cajal score has age; (2) set the two age tolerances below.
# Stage-1 (10k cells, 2026-11-14) was negative: on held-out datasets the head did not beat the dataset-mean
# prior, and integration batch fell. The gate below therefore keeps every Cajal metric, batch included.

[campaign]
id = "CAJAL-V1-AGE-DRAFT"
seed_model = "Cajal v1 shared encoder, five joint pretraining objectives plus age (model.age_head)"
reference_recipe = "configs/experiments/age/logistic.toml"
reference_evaluation = "train_age_reference_10000"  # not implemented yet: see prerequisite (1)
weight_policy = "random_init_self_contained"
agent_brief = "agent_brief.md"

[budget]
schedule_steps = 30000
stop_at = 10000
seeds = [0]
checkpoint_selection = "fixed_stop"
scaling_enabled = false

[resources]
gpu_whitelist = [0, 1, 2, 3, 4]
reason = "GPUs 5, 6 and 7 are excluded by the user"

[objectives]
# The seed model's joint training losses; all must stay active (brainwm_unified.objectives.TASKS).
names = ["gene", "integration", "cell_type", "anatomy", "spatial", "age"]

[freeze]
# Locked by `nanobrain --freeze` in addition to this file, the agent brief, the reference recipe and the
# seed model: the code and records this campaign's tasks are judged with. Data manifests are locked too.
seed_model = "brainwm_unified"
files = [
    "scripts/predict_eval.py",
    "scripts/eval_zero_shot.py",
    "scripts/eval_imputation.py",
    "scripts/eval_age.py",
    "scripts/fit_age_baseline.py",
    "data_build/build_age.py",
    "scripts/eval_env.sh",
    "reference/evaluation_protocol.json",
    "reference/opponents.json",
    "reference/cajal_existing_five_tasks.csv",
    "reference/current_method_scores.json",
    "reference/existing_cajal_v1_10k.json",
    "reference/existing_cajal_v1_config.json",
    "reference/existing_cajal_v1_record.json",
    "reference/input_fingerprints.json",
    "reference/model_dimensions.json",
    "reference/cache_fingerprints.json",
    "reference/baseline_cache/features.pkl",
    "reference/imputation_cache/genes_eval_10k_seed0.json",
    "reference/imputation_cache/spatial_eval_spatial_seed0.json",
]

[freeze.data_files]
# Age labels live next to each dataset; their hashes are locked with it. The hold-out is by dataset.
pretrain = ["age_lower_dpf.npy", "age_upper_dpf.npy", "life_stage.npy", "dataset.npy", "donor.npy"]
annotation = ["age_lower_dpf.npy", "age_upper_dpf.npy", "life_stage.npy", "dataset.npy", "donor.npy"]

[gate]
# A candidate may not fall below its parent by more than this on any metric.
regression_floor = 0.005

[[metrics]]
name = "Cell type fine macro-F1"
group = "annotation"
range = [0.0, 1.0]

[[metrics]]
name = "Region fine macro-F1"
group = "annotation"
range = [0.0, 1.0]

[[metrics]]
name = "Integration bio"
group = "integration"
range = [0.0, 1.0]

[[metrics]]
name = "Integration batch"
group = "integration"
range = [0.0, 1.0]

[[metrics]]
name = "Gene imputation Pearson (cell median)"
group = "genes"
range = [-1.0, 1.0]

[[metrics]]
name = "Spatial imputation Pearson (cell median)"
group = "spatial"
range = [-1.0, 1.0]

# Age, on eval cells of the datasets held out from age training (data.age_holdout = 0.15, unit dataset).
# Smaller is better; tolerances are in the metric's own unit and must be set before freezing.
[[metrics]]
name = "Age interval score, held out (log days)"
group = "age"
range = [0.0, 1000.0]
direction = "min"
tolerance = 0.0  # TO SET before freeze

[[metrics]]
name = "Age median error, held out (days)"
group = "age"
range = [0.0, 100000.0]
direction = "min"
tolerance = 0.0  # TO SET before freeze

[search]
plugin_kinds = ["token_transform", "gene_loss", "cell_type_loss", "anatomy_loss", "optimizer"]
balancers = ["initial", "grad_equal", "famo"]
optimizers = ["grouped_muon", "adamw", "adam", "sgd", "custom"]
regularizers = ["cond_hsic", "sigreg", "batch_swap", "batch_adversary"]

[search.model]
d_model = [128, 256, 384, 512]
n_heads = [2, 4, 6, 8]
n_prelude = [1, 2, 3, 4]
n_core = [1, 2, 3, 4]
n_coda = [1, 2, 3, 4]
loops = [2, 3, 4, 5, 6]
min_loops = [1, 2, 3, 4]
max_loops = [2, 3, 4, 5, 6, 8]
n_experts = [8, 16, 32, 64]
top_k = [1, 2, 4, 8]
n_shared_experts = [1, 2]
expert_hidden = [128, 256, 384, 512]
router_score = ["sqrtsoftplus", "sigmoid"]
n_hash_layers = [0, 1, 2]
nbeats = [false, true]
loop_injection = [false, true]
z_dim = [32, 64, 128]
decoder_hidden = [256, 512, 768, 1024]
decoder = ["separate", "unified"]
latent_reg = ["kl", "mog", "none"]
mog_components = [8, 16, 32, 64]
batch_adversary = [0, 64, 128, 256]
residual_dim = [0, 16, 32, 64]
recon_detach_mu = [false, true]
spatial_d = [64, 128, 256]
spatial_layers = [1, 2, 3, 4]
spatial_residual_mean = [false, true]
input_norm = ["log1p", "pearson"]

[search.model_ranges]
router_bias_rate = [0.0, 0.01]
spatial_latent = [0.0, 5.0]

[search.train_ranges]
lr = [1e-06, 0.02]
weight_decay = [0.0, 0.3]
grad_clip = [0.1, 20.0]
kl_weight = [0.001, 20.0]
kl_target = [0.0, 300.0]
kl_dual_lr = [0.0001, 0.1]
min_lr_ratio = [0.01, 0.5]

[search.train_integers]
warmup_steps = [0, 4000]
kl_warmup_steps = [100, 10000]
norm_steps = [20, 1000]

[search.data_ranges]
dissociated_cells = [16, 512]
spatial_groups = [2, 64]
max_nonzero_tokens = [512, 8192]
zero_tokens = [8, 256]

[search.optimizer_ranges]
adam_beta1 = [0.8, 0.99]
adam_beta2 = [0.9, 0.9999]
adam_eps = [1e-09, 1e-06]
muon_momentum = [0.8, 0.99]
muon_ns_steps = [3, 8]
sgd_momentum = [0.0, 0.99]

[search.balancer_ranges.grad_equal]
every = [1, 200]
beta = [0.5, 0.99]

[search.balancer_ranges.famo]
w_lr = [0.001, 0.1]
gamma = [0.0, 0.1]
eps = [1e-10, 1e-05]

[search.balancer_ranges.initial]
