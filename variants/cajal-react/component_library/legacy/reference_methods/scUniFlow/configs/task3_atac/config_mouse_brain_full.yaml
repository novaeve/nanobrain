# Mouse E18 brain scATAC full-run configuration
# Full ATAC peak set: 172,193 peaks -> grid_size 415 (415^2 = 172,225)

model:
  n_genes: 172193
  grid_size: 415
  d_model: 512
  dual_head: true
  d_state_row: 64
  d_state_col: 16
  n_layers: 8

training:
  experiment_dir: results/task3_atac
  n_gpus: 1
  gpu_ids: "4"
  master_port: 29513
  batch_size_per_gpu: 4
  spectral_coords: "data/task3_atac/pbmc_5k_mouse_brain/e18_mouse_brain_fresh_5k_atac_grid415_coords.npy"
  expression_transform: tfidf_log1p_1e4
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.01
  val_ratio: 0.1
  val_cells: 500
  seed: 42
  epochs: 10
  lr: 0.0005
  min_lr: 0.000001
  val_every_epochs: 1
  save_every_epochs: 1

  loss_weights:
    weighted_x1: 1.0
    pearson: 0.1
    cell_pearson: 0.1
    pearson_nonzero: 0.0
    binary: 1.0
    binary_rank: 0.0

inference:
  n_steps: 10
  temperature: 0.1
  hard_gate: true
  open_threshold: 0.5

validation:
  n_steps: 10
  temperature: 0.1
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.02
  mask_seed: 1234
  noise_seed: 5678
  max_batches: 8
  batch_size: 1
  auprc_guard_multiplier: 2.0
