# Mouse E18 brain scATAC top-50k imputation config.
# Binary gate keeps a depth-scaled number of observed-zero candidate peaks per cell:
# k = observed_nonzero_count * top_k_base_rate, clamped to [top_k_min, top_k_max].

model:
  n_genes: 50000
  grid_size: 224
  d_model: 512
  dual_head: true
  d_state_row: 64
  d_state_col: 16
  n_layers: 8
  activation_checkpointing: true

training:
  experiment_dir: results/task3_atac
  n_gpus: 1
  gpu_ids: "7"
  master_port: 29515
  batch_size_per_gpu: 12
  spectral_coords: "data/task3_atac/pbmc_5k_mouse_brain/e18_mouse_brain_fresh_5k_atac_top50k_grid224_coords.npy"
  expression_transform: tfidf_log1p_1e4
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.01
  val_ratio: 0.1
  val_cells: 500
  seed: 42
  epochs: 10
  lr: 0.0005
  min_lr: 0.000001
  val_every_epochs: 1
  save_every_epochs: 1

  loss_weights:
    weighted_x1: 1.0
    pearson: 0.1
    cell_pearson: 0.1
    pearson_nonzero: 0.0
    binary: 1.0
    binary_rank: 0.0

inference:
  hard_gate: true
  gate_strategy: depth_scaled_top_k
  top_k_base_rate: 0.30
  top_k_min: 50
  top_k_max: 2000
  open_threshold: 0.95
  intensity_mode: one_step
  intensity_t: 0.0
  n_steps: 10
  temperature: 0.1

validation:
  n_steps: 10
  temperature: 0.1
  nonzero_mask_ratio: 0.2
  zero_mask_ratio: 0.02
  mask_seed: 1234
  noise_seed: 5678
  max_batches: 32
  batch_size: 1
  auprc_guard_multiplier: 1.0
